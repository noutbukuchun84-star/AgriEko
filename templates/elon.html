<!DOCTYPE html>
<html lang="uz" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi e'lon qo'shish - AgriEko</title>
    <link rel="stylesheet" href="/Eloncss.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome ikonkalari uchun (orqaga qaytish tugmasi va boshqalar uchun) -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="h-full font-sans antialiased text-slate-800">
     <main class="page">
  <h1>Yangi e'lon joylashtirish</h1>
  <p class="sub">Sotadigan mahsulotingiz haqida ma'lumotlarni kiriting.</p>

  <form class="card" id="elonForm">
    <label class="field">
      <span>Mahsulot yoki e'lon nomi</span>
      <input type="text" placeholder="Masalan: Sarhil qizil olma" required>
    </label>

    <label class="field">
      <span>Kategoriya</span>
      <select required>
        <option value="">Kategoriyani tanlang</option>
        <option value="">Mevalr</option>
        <option value="">Sabzavotlar</option>
        <option value="">Don va don mahsulotlari</option>
        <option value="">Qishloq xõjalik yexnikasi</option>
      </select>
    </label>

    <label class="field">
      <span>Narxi (so'mda)</span>
      <div class="input-suffix">
        <input type="number" placeholder="0" min="0" required>
        <em>UZS</em>
      </div>
    </label>

    <label class="field">
      <span>Sotuvchi telefon raqami</span>
      <div class="input-prefix">
        <em>+998</em>
        <input type="tel" placeholder="90 123 45 67" required>
      </div>
    </label>

    <div class="field">
      <span>Mahsulot rasmi</span>
      <label class="drop">
        <input type="file" accept="image/png,image/jpeg" hidden>
        <strong>Rasm yuklash</strong>
        <small>yoki shu yerga tashlang</small>
        <small>PNG, JPG, JPEG (maksimal 5MB)</small>
      </label>
    </div>

    <label class="field">
      <span>Mahsulot haqida qo'shimcha ma'lumot</span>
      <textarea rows="4" placeholder="Mahsulot holati, hajmi yoki yetkazib berish shartlari"></textarea>
    </label>

    <button type="submit" class="submit">E'lonni joylashtirish</button>
  </form>

  <footer>© 2026 AgriEko. Barcha huquqlar himoyalangan.</footer>
     </main>
